name: Aegis vulnerability scan

# Callable vulnerability scan for any repo. Wraps Google's maintained osv-scanner
# reusable workflow (lockfile/manifest scanning + SARIF upload) and adds a
# govulncheck pass for Go modules (reachable-vulnerability analysis).
#
# Callers need to grant the job:
#   permissions:
#     contents: read
#     actions: read          # lets the SARIF upload read workflow status
#     security-events: write # uploads results to Security > Code scanning
#
#   jobs:
#     scan:
#       uses: ogtechnologiesco/stellar-pg-aegis-frontend/.github/workflows/aegis-scan.yml@<ref>
#       permissions:
#         contents: read
#         actions: read
#         security-events: write

on:
  workflow_call:
    inputs:
      scan-args:
        description: 'Arguments forwarded to osv-scanner, one per line'
        required: false
        type: string
        default: |
          --recursive
          ./
      fail-on-vuln:
        description: 'Fail the job when vulnerabilities are found'
        required: false
        type: boolean
        default: true
      govulncheck:
        description: 'Run govulncheck on Go modules (reachable-vulnerability analysis)'
        required: false
        type: boolean
        default: true
      semgrep:
        description: 'Run Semgrep SAST scan'
        required: false
        type: boolean
        default: true
      semgrep-config:
        description: 'Semgrep config — registry ruleset name or local rules path'
        required: false
        type: string
        default: 'p/security-audit'
      scout:
        description: 'CoinFabrik scout-audit Soroban contract lint in the coinfabrik/scout container — only when a soroban-sdk manifest exists. Compiles the workspace (build.rs executes); opt-in only.'
        required: false
        type: boolean
        default: false
      rust-reach:
        description: 'EXPERIMENTAL: reachsec Rust MIR call-graph reachability — emits real call chains into advisory-affected functions. Compiles the workspace (build.rs executes); opt-in only.'
        required: false
        type: boolean
        default: false
      sarif-upload:
        description: 'Upload results to GitHub code scanning'
        required: false
        type: boolean
        default: true

jobs:
  # PR-diff scan: only flags vulnerabilities the change introduces.
  osv-scan-pr:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.7.0
    with:
      scan-args: ${{ inputs.scan-args }}
      upload-sarif: ${{ inputs.sarif-upload }}
      fail-on-vuln: ${{ inputs.fail-on-vuln }}

  # Full scan: schedules, dispatches, pushes — reports all known vulnerabilities.
  osv-scan:
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.0
    with:
      scan-args: ${{ inputs.scan-args }}
      upload-sarif: ${{ inputs.sarif-upload }}
      fail-on-vuln: ${{ inputs.fail-on-vuln }}

  govulncheck:
    if: inputs.govulncheck
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Go modules
        id: mods
        run: |
          if find . -name go.mod -not -path './vendor/*' -print -quit | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.mods.outputs.present == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: govulncheck
        id: govc
        if: steps.mods.outputs.present == 'true'
        env:
          SARIF: ${{ inputs.sarif-upload }}
          FAIL: ${{ inputs.fail-on-vuln }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          tmp=$(mktemp -d)
          flagged=0
          while IFS= read -r -d '' mod; do
            dir=$(dirname "$mod")
            echo "==> govulncheck $dir"
            code=0
            (cd "$dir" && govulncheck ./...) || code=$?
            # exit 3 = vulnerabilities found; other non-zero = analysis error
            if [ "$code" -eq 3 ]; then flagged=1
            elif [ "$code" -ne 0 ]; then echo "::warning::govulncheck failed in $dir (exit $code)"; fi
            if [ "$SARIF" = "true" ]; then
              (cd "$dir" && govulncheck -format sarif ./...) > "$tmp/$(echo "$dir" | tr '/.' '__').sarif" || true
            fi
          done < <(find . -name go.mod -not -path './vendor/*' -print0)
          if [ "$SARIF" = "true" ]; then
            jq -s '{"$schema": "https://json.schemastore.org/sarif-2.1.0.json", version: "2.1.0", runs: [.[].runs[]]}' "$tmp"/*.sarif > "$GITHUB_WORKSPACE/govc-results.sarif"
            echo "sarif=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "$flagged" -eq 1 ]; then
            echo "::warning title=govulncheck::Code paths into vulnerable symbols found — see job log and code scanning"
          else
            echo "No reachable vulnerabilities in Go modules" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$FAIL" = "true" ] && [ "$flagged" -eq 1 ]; then exit 1; fi

      - name: Upload govulncheck SARIF
        if: steps.govc.outputs.sarif == 'true'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: govc-results.sarif
          category: govulncheck

  # Rust reachability: EXPERIMENTAL reachsec (github.com/xizheyin/reachsec,
  # cargo-audit companion). Builds a MIR call graph of the workspace under a
  # pinned nightly and reports real call chains into advisory-affected functions
  # (statuses: reachable / not_reachable = no path found — still potentially
  # vulnerable / analysis_failed / no_metadata = advisory lacks function list).
  # WARNING: compiles the checked-out code — dependency build.rs executes. Keep
  # off for untrusted sources. Works on a project rust-toolchain.toml pin via
  # explicit +nightly override.
  rust-reach:
    if: inputs.rust-reach
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Rust crates
        id: crates
        run: |
          if find . -name Cargo.toml -not -path './target/*' -print -quit | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Rust
        if: steps.crates.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install reachsec + callgraph4rs
        if: steps.crates.outputs.present == 'true'
        env:
          REACHSEC_SHA: '548b228ba35774664d4d691b6fddf537aa6225db'
          CG4RS_NIGHTLY: 'nightly-2025-08-09'
        run: |
          rustup toolchain install "$CG4RS_NIGHTLY" --component rustc-dev llvm-tools-preview
          tmp=$(mktemp -d)
          git clone https://github.com/xizheyin/reachsec "$tmp/reachsec"
          git -C "$tmp/reachsec" checkout "$REACHSEC_SHA"
          git -C "$tmp/reachsec" submodule update --init callgraph4rs
          cargo install --path "$tmp/reachsec" --bin reachsec
          cargo +"$CG4RS_NIGHTLY" install --path "$tmp/reachsec/callgraph4rs" --force

      - name: Rust reachability analysis (reachsec)
        id: rust
        if: steps.crates.outputs.present == 'true'
        env:
          SARIF: ${{ inputs.sarif-upload }}
          FAIL: ${{ inputs.fail-on-vuln }}
        run: |
          code=0
          reachsec check --path . --json > reachsec.json || code=$?
          # exit 1 = a reachable advisory was found; other failures produce no JSON
          if ! python3 -c 'import json; json.load(open("reachsec.json"))' 2>/dev/null; then
            echo "::warning::reachsec produced no JSON output (exit $code) — the workspace likely did not build under the analysis toolchain"
            echo 'Rust reachability analysis failed — the workspace did not build under the analysis toolchain.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          reachable=$(jq '[.[] | select(.status == "reachable")] | length' reachsec.json)
          notreach=$(jq '[.[] | select(.status == "not_reachable")] | length' reachsec.json)
          failed=$(jq '[.[] | select(.status == "analysis_failed")] | length' reachsec.json)
          nometa=$(jq '[.[] | select(.status == "no_metadata")] | length' reachsec.json)
          if [ "$SARIF" = "true" ] && [ "$reachable" -gt 0 ]; then
            python3 - <<'PY' || echo "::warning::reachsec SARIF conversion failed"
          import json
          data = json.load(open('reachsec.json'))
          rules, results = {}, []
          for r in data:
              if r.get('status') != 'reachable':
                  continue
              rid = r['advisory_id']
              rules[rid] = {
                  'id': rid, 'name': rid,
                  'helpUri': r.get('url') or '',
                  'shortDescription': {'text': r.get('title') or rid},
                  'fullDescription': {'text': f"{r.get('title','')} ({r.get('package','')} {r.get('version','')})"},
              }
              flows = []
              for chain in r.get('call_chains') or []:
                  steps = [s.strip() for s in str(chain).lstrip('→ ').split('->') if s.strip()]
                  flows.append({'locations': [
                      {'location': {'message': {'text': s}}}
                      for s in steps
                  ]})
              results.append({
                  'ruleId': r['advisory_id'],
                  'level': 'error',
                  'message': {'text': f"{r['advisory_id']}: {r.get('title','')} — {r.get('package','')} {r.get('version','')} reachable"},
                  'codeFlows': [{'threadFlows': [{'locations': fl} for fl in flows]}] if flows else [],
              })
          sarif = {
              '$schema': 'https://json.schemastore.org/sarif-2.1.0.json',
              'version': '2.1.0',
              'runs': [{
                  'tool': {'driver': {'name': 'reachsec', 'informationUri': 'https://github.com/xizheyin/reachsec', 'rules': list(rules.values())}},
                  'results': results,
              }],
          }
          json.dump(sarif, open('reachsec.sarif', 'w'), indent=1)
          PY
          fi
          echo "reachable=$reachable" >> "$GITHUB_OUTPUT"
          {
            echo '### Rust reachability (reachsec)'
            echo ''
            echo '| status | advisories |'
            echo '| --- | --- |'
            echo "| reachable (call chain found) | $reachable |"
            echo "| not_reachable (no chain found — potentially vulnerable) | $notreach |"
            echo "| analysis_failed | $failed |"
            echo "| no_metadata (advisory lacks function list) | $nometa |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$reachable" -gt 0 ]; then
            echo "::warning title=rust-reach::$reachable advisories with reachable call paths — see code scanning"
          fi
          if [ "$FAIL" = "true" ] && [ "$reachable" -gt 0 ]; then exit 1; fi

      - name: Upload reachsec SARIF
        if: inputs.sarif-upload && steps.rust.outputs.reachable != '0' && steps.rust.outputs.reachable != '' && hashFiles('reachsec.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reachsec.sarif
          category: rust-reach

      - name: Upload reachsec JSON
        if: steps.rust.outputs.reachable != '' && hashFiles('reachsec.json') != ''
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: reachsec-results
          path: reachsec.json

  # SAST: Semgrep scan with a pinned ruleset, SARIF to code scanning.
  semgrep:
    if: inputs.semgrep
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Semgrep
        run: pip install semgrep==1.184.0

      - name: Semgrep scan
        id: scan
        env:
          CFG: ${{ inputs.semgrep-config }}
          SARIF: ${{ inputs.sarif-upload }}
          FAIL: ${{ inputs.fail-on-vuln }}
        run: |
          code=0
          semgrep scan --config "$CFG" --jobs 2 --max-memory 5000 --timeout 60 \
            --metrics=off --disable-version-check --exclude '*.min.js' \
            --json-output semgrep.json --sarif-output semgrep.sarif ./ || code=$?
          # semgrep exits 1 when findings exist; >1 = scan/config error
          if [ "$code" -gt 1 ]; then
            echo "::warning::semgrep exited with code $code"
            exit "$code"
          fi
          count=$(jq '.results | length' semgrep.json)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -gt 0 ]; then
            echo "::warning title=Semgrep::$count static-analysis findings — see code scanning"
          else
            echo "No Semgrep findings" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$FAIL" = "true" ] && [ "$count" -gt 0 ]; then exit 1; fi

      - name: Upload Semgrep SARIF
        if: inputs.sarif-upload && hashFiles('semgrep.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # Soroban contract lint: CoinFabrik scout-audit (Dylint) in its container.
  # Only runs when a soroban-sdk manifest exists — it COMPILES the workspace
  # under a pinned detector nightly, so dependency build.rs executes; the
  # container gets no env passthrough. Opt-in only. Tool failures warn and
  # exit clean; fail-on-vuln gates on the finding count, like Semgrep.
  scout:
    if: inputs.scout
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Soroban contracts
        id: contracts
        run: |
          if grep -rl 'soroban-sdk' --include='Cargo.toml' --include='Cargo.lock' . | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Scout contract lint (docker)
        id: scout
        if: steps.contracts.outputs.present == 'true'
        env:
          SARIF: ${{ inputs.sarif-upload }}
          FAIL: ${{ inputs.fail-on-vuln }}
          SCOUT_VERSION: '0.3.17'
          # dylint 4.1.2 (pinned by scout) revparses the deleted master branch of
          # rust-clippy on cold driver builds; the mirror restores it (see
          # scripts/scout.ts for the same workaround in the snapshot pipeline).
          CLIPPY_MASTER_SHA: 'c71f7b63f8fb3d7f0b2b0e26d0e029646f93fb9e'
        run: |
          # Project rust-toolchain pins break detector compilation — neutralize them.
          find . -name 'rust-toolchain' -o -name 'rust-toolchain.toml' -o -name 'rust-toolchain.yaml' | xargs -r rm -f
          # full bare clone ~15MB — --shallow-since breaks on the JOSH-filtered
          # history (phantom parents after the rust-clippy JOSH migration)
          git clone --bare https://github.com/rust-lang/rust-clippy /tmp/clippy-mirror
          git -C /tmp/clippy-mirror branch -f master "$CLIPPY_MASTER_SHA"
          mkdir -p /tmp/scout-out
          code=0
          docker run --rm \
            -e INPUT_TARGET=/src \
            -e 'INPUT_SCOUT_ARGS=-o sarif --output-path /out/scout.sarif' \
            -v "$PWD:/src" \
            -v /tmp/scout-out:/out \
            -v /tmp/clippy-mirror:/clippy:ro \
            --entrypoint bash \
            "coinfabrik/scout:$SCOUT_VERSION" \
            -c 'git config --global url."file:///clippy".insteadOf "https://github.com/rust-lang/rust-clippy" 2>/dev/null; /usr/local/bin/entrypoint.sh' || code=$?
          # scout exits 0 even with findings; no output file = analysis failed
          if [ ! -s /tmp/scout-out/scout.sarif ]; then
            echo "::warning::scout produced no results (exit $code) — the workspace likely did not compile under the detector nightly (rustc 1.92)"
            echo 'Scout contract lint produced no results — the workspace did not compile under the pinned detector toolchain.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cp /tmp/scout-out/scout.sarif scout.sarif
          count=$(jq '[.runs[].results[]] | length' scout.sarif)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          {
            echo '### Scout (Soroban contract lint)'
            echo ''
            echo "| findings | $count |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -gt 0 ]; then
            echo "::warning title=scout::$count Soroban contract findings — see code scanning"
          fi
          if [ "$FAIL" = "true" ] && [ "$count" -gt 0 ]; then exit 1; fi

      - name: Upload Scout SARIF
        if: inputs.sarif-upload && steps.scout.outputs.count != '' && hashFiles('scout.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: scout.sarif
          category: scout
